[project]
name = "add-music"
version = "0.1.0"
description = "Kid-friendly page for adding YouTube Music albums to a Jellyfin library"
readme = "README.md"
authors = [
    { name = "functionalStoic", email = "7215306+functionalStoic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
add-music = "add_music:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
